name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client
      - run: ./scripts/test-db.sh

  # End-to-end test (apps/web/e2e). Runs the real app against a local Supabase stack; all
  # email (sign-in links and app emails) lands in the stack's Mailpit inbox, never a real one.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://127.0.0.1:3000
      ORGANIZER_EMAILS: organizer@example.com
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "54325"
      SMTP_USER: e2e
      SMTP_PASS: e2e
      EMAIL_FROM: Secret Santa <e2e@example.com>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @santa/web exec playwright install --with-deps chromium
      # Applies supabase/migrations. Skips services the app doesn't use.
      - run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,storage-api,realtime,postgres-meta,supavisor
      - name: Point the app at the local stack
        run: |
          supabase status -o env | sed 's/"//g' > status.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' status.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' status.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' status.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm --filter @santa/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
      - if: failure()
        run: supabase logs 2>/dev/null | tail -100 || true
